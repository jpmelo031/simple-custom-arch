<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768" role="img" aria-labelledby="title description">
  <title id="title">Majula theme preview</title>
  <desc id="description">A compact 1366 by 768 desktop mockup showing the Majula palette with four-pixel gaps, slim application title bars, Waybar, VS Code, a centered Rofi update dialog, Kitty update output, Dunst, and labeled color swatches.</desc>
  <style>
    .background { fill: #0E1114; }
    .surface { fill: #171C20; }
    .elevated { fill: #20272C; }
    .border { fill: #465056; }
    .text { fill: #DDD6C6; }
    .muted { fill: #A39B8C; }
    .accent { fill: #D1A35C; }
    .ember { fill: #E0783E; }
    .info { fill: #7899A2; }
    .success { fill: #87996D; }
    .danger { fill: #C06452; }
    .panel { fill: #171C20; stroke: #465056; stroke-width: 1; }
    .raised { fill: #20272C; stroke: #465056; stroke-width: 1; }
    .rule { stroke: #465056; stroke-width: 1; }
    .focus-rule { stroke: #E0783E; stroke-width: 2; }
    .ui { font-family: sans-serif; }
    .code { font-family: monospace; }
    .xs { font-size: 10px; }
    .sm { font-size: 11px; }
    .body { font-size: 12px; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
    .title { font-size: 17px; font-weight: 700; }
    .swatch-name { font-size: 12px; font-weight: 700; }
    .swatch-value { font-size: 11px; }
  </style>

  <rect class="background" width="1366" height="768"/>

  <!-- Desktop and Waybar -->
  <g id="desktop" class="ui">
    <rect class="panel" x="4" y="4" width="996" height="28" rx="5"/>
    <text class="accent label" x="16" y="23">Desktop</text>
    <rect class="accent" x="96" y="10" width="24" height="16" rx="4"/>
    <text class="background sm" x="104" y="22">1</text>
    <text class="muted sm" x="132" y="22">2</text>
    <text class="muted sm" x="155" y="22">3</text>
    <text class="text sm" x="483" y="22">THU 22:14</text>
    <text class="info sm" x="795" y="22">NET</text>
    <text class="text sm" x="834" y="22">Wi-Fi</text>
    <text class="muted sm" x="879" y="22">VOL 32%</text>
    <text class="success sm" x="945" y="22">BAT 86%</text>
  </g>

  <!-- VS Code window -->
  <g id="vscode" class="ui">
    <rect class="panel" x="4" y="36" width="996" height="452" rx="6"/>
    <path class="focus-rule" d="M10 37 H994"/>
    <rect class="elevated" x="5" y="37" width="994" height="24" rx="5"/>
    <circle class="danger" cx="19" cy="49" r="3.5"/>
    <circle class="accent" cx="32" cy="49" r="3.5"/>
    <circle class="success" cx="45" cy="49" r="3.5"/>
    <text class="text label" x="60" y="54">VS Code</text>
    <text class="muted sm" x="463" y="53">simple-custom-arch — theme.md</text>

    <rect class="surface" x="5" y="61" width="43" height="426"/>
    <rect class="accent" x="5" y="74" width="2" height="29"/>
    <text class="text title" x="21" y="94">◇</text>
    <text class="muted title" x="21" y="132">⌕</text>
    <text class="muted title" x="21" y="170">⑂</text>
    <text class="muted title" x="21" y="208">□</text>
    <text class="muted title" x="21" y="459">⚙</text>

    <rect class="surface" x="48" y="61" width="196" height="426"/>
    <line class="rule" x1="244" y1="61" x2="244" y2="487"/>
    <text class="muted xs" x="61" y="81">EXPLORER</text>
    <text class="text sm" x="61" y="105">⌄ SIMPLE-CUSTOM-ARCH</text>
    <text class="muted sm" x="73" y="129">⌄ docs</text>
    <rect class="elevated" x="49" y="138" width="194" height="25"/>
    <text class="accent sm" x="89" y="155">theme.md</text>
    <text class="muted sm" x="73" y="180">› config</text>
    <text class="muted sm" x="73" y="202">› packages</text>
    <text class="muted sm" x="73" y="224">› scripts</text>
    <text class="muted sm" x="73" y="246">README.md</text>

    <rect class="background" x="244" y="61" width="755" height="303"/>
    <rect class="elevated" x="244" y="61" width="147" height="28"/>
    <rect class="accent" x="244" y="87" width="147" height="2"/>
    <text class="text sm" x="261" y="80">theme.md</text>
    <text class="muted sm" x="403" y="80">README.md</text>
    <line class="rule" x1="244" y1="89" x2="999" y2="89"/>

    <g class="code body">
      <text class="border" x="264" y="119">1</text>
      <text class="accent" x="292" y="119"># Majula Theme</text>
      <text class="border" x="264" y="145">2</text>
      <text class="muted" x="292" y="145">A calm desktop for late-night work.</text>
      <text class="border" x="264" y="180">4</text>
      <text class="info" x="292" y="180">[palette]</text>
      <text class="text" x="367" y="180">background</text>
      <text class="ember" x="460" y="180">=</text>
      <text class="success" x="479" y="180">"#0E1114"</text>
      <text class="border" x="264" y="205">5</text>
      <text class="text" x="367" y="205">surface</text>
      <text class="ember" x="439" y="205">=</text>
      <text class="success" x="458" y="205">"#171C20"</text>
      <text class="border" x="264" y="230">6</text>
      <text class="text" x="367" y="230">accent</text>
      <text class="ember" x="430" y="230">=</text>
      <text class="success" x="449" y="230">"#D1A35C"</text>
      <text class="border" x="264" y="265">8</text>
      <text class="info" x="292" y="265">[layout]</text>
      <text class="muted" x="367" y="265"># compact at 1366x768</text>
      <text class="border" x="264" y="290">9</text>
      <text class="text" x="367" y="290">gaps</text>
      <text class="ember" x="412" y="290">=</text>
      <text class="accent" x="431" y="290">6</text>
      <text class="border" x="264" y="315">10</text>
      <text class="text" x="367" y="315">titlebar</text>
      <text class="ember" x="439" y="315">=</text>
      <text class="accent" x="458" y="315">24</text>
    </g>

    <rect class="surface" x="244" y="364" width="755" height="123"/>
    <line class="rule" x1="244" y1="364" x2="999" y2="364"/>
    <text class="text xs" x="262" y="385">PROBLEMS</text>
    <text class="accent xs" x="336" y="385">TERMINAL</text>
    <rect class="accent" x="334" y="392" width="52" height="2"/>
    <g class="code sm">
      <text class="muted" x="262" y="416">~/Projects/simple-custom-arch</text>
      <text class="accent" x="446" y="416">$</text>
      <text class="text" x="460" y="416">git status --short</text>
      <text class="success" x="262" y="439">[ok]</text>
      <text class="text" x="297" y="439">working tree clean</text>
      <text class="muted" x="262" y="462">ready for the next phase</text>
    </g>
  </g>

  <!-- Centered Rofi dialog -->
  <g id="rofi" class="ui">
    <rect x="307" y="122" width="396" height="260" rx="12" fill="#0E1114" opacity=".72"/>
    <rect class="raised" x="315" y="130" width="380" height="244" rx="10"/>
    <rect class="ember" x="315" y="130" width="4" height="244" rx="2"/>
    <text class="accent label" x="337" y="157">Rofi</text>
    <text class="text title" x="337" y="188">System updates are ready</text>
    <text class="muted body" x="337" y="212">12 official packages · 2 AUR packages</text>
    <rect class="surface" x="337" y="230" width="336" height="52" rx="6"/>
    <text class="info label" x="353" y="252">i</text>
    <text class="text body" x="372" y="251">A full upgrade will open in Kitty.</text>
    <text class="muted sm" x="372" y="270">Power actions run only after verification.</text>

    <rect class="surface" x="337" y="306" width="78" height="36" rx="6"/>
    <text class="muted sm" x="360" y="329">Close</text>
    <rect class="accent" x="423" y="306" width="116" height="36" rx="6"/>
    <text class="background sm" x="433" y="329">Update &amp; Restart</text>
    <rect class="surface" x="547" y="306" width="126" height="36" rx="6"/>
    <text class="ember sm" x="555" y="329">Update &amp; Shut Down</text>
    <text class="muted xs" x="337" y="359">Esc closes · Enter confirms selection</text>
  </g>

  <!-- Kitty update terminal -->
  <g id="kitty" class="ui">
    <rect class="panel" x="4" y="492" width="648" height="272" rx="6"/>
    <rect class="elevated" x="5" y="493" width="646" height="24" rx="5"/>
    <circle class="danger" cx="19" cy="505" r="3.5"/>
    <circle class="accent" cx="32" cy="505" r="3.5"/>
    <circle class="success" cx="45" cy="505" r="3.5"/>
    <text class="text label" x="60" y="510">Kitty</text>
    <text class="muted sm" x="281" y="509">system update — simple-custom-arch</text>
    <g class="code body">
      <text class="accent" x="26" y="542">$</text>
      <text class="text" x="42" y="542">Update summary</text>
      <text class="muted" x="26" y="569">official</text>
      <text class="text" x="100" y="569">linux  git  kitty  code</text>
      <text class="muted" x="26" y="592">aur</text>
      <text class="text" x="100" y="592">zen-browser-bin  visual-studio-code-bin</text>
      <text class="info" x="26" y="621">[i]</text>
      <text class="text" x="58" y="621">Checking Arch news and package signatures...</text>
      <text class="ember" x="26" y="650">[42%]</text>
      <text class="text" x="72" y="650">Downloading packages</text>
      <rect class="border" x="228" y="641" width="289" height="10" rx="5"/>
      <rect class="ember" x="228" y="641" width="121" height="10" rx="5"/>
      <text class="success" x="26" y="679">[ok]</text>
      <text class="text" x="65" y="679">Snapshot and keyring checks passed</text>
      <text class="danger" x="26" y="708">[!]</text>
      <text class="text" x="58" y="708">Failure example: power action blocked</text>
      <text class="muted" x="26" y="737">Log: ~/.local/state/simple-custom-arch/update/</text>
    </g>
  </g>

  <!-- Dunst notification and desktop notes -->
  <g id="dunst" class="ui">
    <rect class="raised" x="656" y="492" width="344" height="112" rx="6"/>
    <rect class="info" x="656" y="492" width="4" height="112" rx="2"/>
    <circle class="info" cx="686" cy="527" r="13"/>
    <text class="background label" x="683" y="532">i</text>
    <text class="info label" x="712" y="513">Dunst</text>
    <text class="text label" x="712" y="536">Updates available</text>
    <text class="muted body" x="712" y="557">14 packages are ready.</text>
    <text class="muted sm" x="712" y="578">Open the menu to review them.</text>

    <rect class="panel" x="656" y="608" width="344" height="156" rx="6"/>
    <text class="accent label" x="678" y="638">Majula at 1366×768</text>
    <text class="text body" x="678" y="666">Compact controls, clear focus, low glare.</text>
    <text class="muted sm" x="678" y="692">4 px gaps · 24 px app bars · fonts unchanged</text>
    <text class="muted sm" x="678" y="713">Status colors always include words or symbols.</text>
    <line class="rule" x1="678" y1="733" x2="980" y2="733"/>
    <circle class="accent" cx="688" cy="747" r="4"/>
    <circle class="ember" cx="704" cy="747" r="4"/>
    <circle class="info" cx="720" cy="747" r="4"/>
    <circle class="success" cx="736" cy="747" r="4"/>
    <circle class="danger" cx="752" cy="747" r="4"/>
  </g>

  <!-- Palette -->
  <g id="palette" class="ui">
    <rect class="panel" x="1004" y="4" width="358" height="760" rx="6"/>
    <text class="accent title" x="1022" y="30">Palette</text>
    <text class="muted sm" x="1022" y="49">Semantic tokens · Majula</text>

    <g transform="translate(1022 66)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="background" x="10" y="8" width="32" height="32" rx="5" stroke="#465056"/>
      <text class="text swatch-name" x="54" y="21">background</text>
      <text class="muted code swatch-value" x="54" y="38">#0E1114 · desktop</text>
    </g>
    <g transform="translate(1022 120)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="surface" x="10" y="8" width="32" height="32" rx="5" stroke="#465056"/>
      <text class="text swatch-name" x="54" y="21">surface</text>
      <text class="muted code swatch-value" x="54" y="38">#171C20 · panels</text>
    </g>
    <g transform="translate(1022 174)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="elevated" x="10" y="8" width="32" height="32" rx="5" stroke="#465056"/>
      <text class="text swatch-name" x="54" y="21">elevated</text>
      <text class="muted code swatch-value" x="54" y="38">#20272C · dialogs</text>
    </g>
    <g transform="translate(1022 228)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="border" x="10" y="8" width="32" height="32" rx="5"/>
      <text class="text swatch-name" x="54" y="21">border</text>
      <text class="muted code swatch-value" x="54" y="38">#465056 · dividers</text>
    </g>
    <g transform="translate(1022 282)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="text" x="10" y="8" width="32" height="32" rx="5"/>
      <text class="text swatch-name" x="54" y="21">text</text>
      <text class="muted code swatch-value" x="54" y="38">#DDD6C6 · primary</text>
    </g>
    <g transform="translate(1022 336)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="muted" x="10" y="8" width="32" height="32" rx="5"/>
      <text class="text swatch-name" x="54" y="21">muted</text>
      <text class="muted code swatch-value" x="54" y="38">#A39B8C · secondary</text>
    </g>
    <g transform="translate(1022 390)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="accent" x="10" y="8" width="32" height="32" rx="5"/>
      <text class="text swatch-name" x="54" y="21">accent</text>
      <text class="muted code swatch-value" x="54" y="38">#D1A35C · selection</text>
    </g>
    <g transform="translate(1022 444)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="ember" x="10" y="8" width="32" height="32" rx="5"/>
      <text class="text swatch-name" x="54" y="21">ember</text>
      <text class="muted code swatch-value" x="54" y="38">#E0783E · focus</text>
    </g>
    <g transform="translate(1022 498)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="info" x="10" y="8" width="32" height="32" rx="5"/>
      <text class="text swatch-name" x="54" y="21">info</text>
      <text class="muted code swatch-value" x="54" y="38">#7899A2 · status</text>
    </g>
    <g transform="translate(1022 552)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="success" x="10" y="8" width="32" height="32" rx="5"/>
      <text class="text swatch-name" x="54" y="21">success</text>
      <text class="muted code swatch-value" x="54" y="38">#87996D · complete</text>
    </g>
    <g transform="translate(1022 606)">
      <rect class="elevated" width="322" height="48" rx="5"/>
      <rect class="danger" x="10" y="8" width="32" height="32" rx="5"/>
      <text class="text swatch-name" x="54" y="21">danger</text>
      <text class="muted code swatch-value" x="54" y="38">#C06452 · failure</text>
    </g>

    <line class="rule" x1="1022" y1="681" x2="1344" y2="681"/>
    <text class="text body" x="1022" y="706">Quiet by default. Warm at the edges.</text>
    <text class="muted sm" x="1022" y="730">Designed for focused work after dark.</text>
  </g>
</svg>
